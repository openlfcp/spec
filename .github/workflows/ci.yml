name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-vector-migration.mjs reads the pre-migration suites from history.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Python generators of the Wire suites need cryptography; the
      # identity corpora check regenerates LFCP-IDENTITY-TEST-VECTORS-01 with
      # it (the runner's python3; .venv is ignored by Git and by validate.sh).
      - run: python3 -m venv .venv && .venv/bin/pip install "cryptography==50.0.2"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: ./scripts/validate.sh
        env:
          LFCP_PYTHON: .venv/bin/python
          LFCP_REQUIRE_ALL_CORPORA: "1"
